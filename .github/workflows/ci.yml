# Continuous integration for the module.
#
# Follows the checks PrestaShop runs on its own modules (ps_wirepayment,
# ps_checkpayment): PHP syntax across the supported PHP versions, the
# PrestaShop coding standard via PHP-CS-Fixer, PHPStan against real PrestaShop
# sources, and a release artefact built the way the marketplace expects it.
# On top of that come the module's own PHPUnit suites: the unit suite on the
# runner, the integration suite inside PrestaShop Flashlight, a pre-installed
# shop that boots from a database dump in seconds.
#
# The development tooling lives in dev/ as a separate Composer project so it
# never lands in the module's vendor/ (PrestaShop autoloads that on every
# request). Every job that needs it installs both projects.
#
# The `changes` job classifies what a run changed (.github/actions/changes): a pull
# request that only touches documentation runs the syntax check and nothing else;
# every other change runs every job. A newer push to the same pull request cancels
# the run in progress; pushes to main always run to the end.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, Monday: the whole suite on main, and the check that the branch rules on GitHub
  # are the ones in .github/rulesets/main.json.
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

# A newer push to the same pull request cancels its run in progress. Every other run (push to main,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending main run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PrestaShop 9 requires PHP 8.1; the module and the core require 8.2.
  PHP_MIN: '8.2'

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  # Syntax check across every PHP version the module claims to support. The
  # PHP version is part of the action path, and `uses:` cannot take an
  # expression, so the steps are spelled out.
  lint:
    name: PHP syntax 8.2 => 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master

      - name: PHP syntax checker 8.3
        uses: prestashop/github-action-php-lint/8.3@master

      - name: PHP syntax checker 8.4
        uses: prestashop/github-action-php-lint/8.4@master

  # PrestaShop's coding standard (prestashop/php-dev-tools), checked, not fixed.
  coding-standard:
    name: PHP-CS-Fixer
    needs: changes
    # Fail-safe: a failed `changes` job leaves the output empty and the job runs; a skipped
    # job would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MIN }}
          coverage: none

      - name: Install development tooling
        uses: ramsey/composer-install@v4
        with:
          working-directory: dev

      - name: Check coding standard
        run: dev/vendor/bin/php-cs-fixer fix --config=dev/.php-cs-fixer.dist.php --dry-run --diff --show-progress=none

  # No PrestaShop, no database, no network. Runs on the oldest and newest PHP.
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    needs: changes
    # Fail-safe: a failed `changes` job leaves the output empty and the job runs; a skipped
    # job would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install module dependencies
        uses: ramsey/composer-install@v4

      - name: Install development tooling
        uses: ramsey/composer-install@v4
        with:
          working-directory: dev

      - name: Run unit suite
        run: dev/vendor/bin/phpunit -c dev/phpunit.xml.dist --testsuite unit --do-not-cache-result

  # Static analysis against the actual PrestaShop sources, one job per
  # supported PrestaShop release line. The official image ships the complete
  # source tree at /var/www/html, which is exactly what dev/phpstan.neon.dist
  # scans, so the analysis in CI matches the one run against the local shop.
  phpstan:
    name: PHPStan (PrestaShop ${{ matrix.prestashop }})
    needs: changes
    # Fail-safe: a failed `changes` job leaves the output empty and the job runs; a skipped
    # job would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # <PrestaShop line>-<PHP version> tags of prestashop/prestashop.
        prestashop: ['9.0-8.2', '9.1-8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MIN }}
          coverage: none

      - name: Install module dependencies
        uses: ramsey/composer-install@v4

      - name: Install development tooling
        uses: ramsey/composer-install@v4
        with:
          working-directory: dev

      # Docker Hub counts anonymous pulls per IP, and GitHub-hosted runners share
      # theirs with everyone, so pulls failed at random with "toomanyrequests".
      # Logged in, they count against the organisation's account instead.
      # A Dependabot pull request runs without the organisation's secrets, so the login
      # is skipped there and the images are pulled anonymously — fewer pulls per IP, but a
      # run that passes instead of one that fails on "Username and password required".
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run PHPStan inside prestashop/prestashop:${{ matrix.prestashop }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/var/www/html/modules/ledgerdirect \
            -w /var/www/html/modules/ledgerdirect \
            prestashop/prestashop:${{ matrix.prestashop }} \
            php dev/vendor/bin/phpstan analyse -c dev/phpstan.neon.dist --no-progress --error-format=github

  # Real database, real orders, real ObjectModel behaviour. Flashlight brings
  # up an installed PrestaShop 9 with demo data from a dump; the module is
  # mounted in and installed through the console, exactly like a merchant
  # install minus the Back Office.
  integration:
    name: Integration tests (Flashlight)
    needs: changes
    # Fail-safe: a failed `changes` job leaves the output empty and the job runs; a skipped
    # job would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MIN }}
          coverage: none

      - name: Install module dependencies
        uses: ramsey/composer-install@v4

      - name: Install development tooling
        uses: ramsey/composer-install@v4
        with:
          working-directory: dev

      # Docker Hub counts anonymous pulls per IP, and GitHub-hosted runners share
      # theirs with everyone, so pulls failed at random with "toomanyrequests".
      # Logged in, they count against the organisation's account instead.
      # A Dependabot pull request runs without the organisation's secrets, so the login
      # is skipped there and the images are pulled anonymously — fewer pulls per IP, but a
      # run that passes instead of one that fails on "Username and password required".
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PrestaShop Flashlight
        run: docker compose -f dev/ci/docker-compose.yml up -d --wait --quiet-pull

      - name: Install the module
        run: docker compose -f dev/ci/docker-compose.yml exec -T prestashop php bin/console prestashop:module install ledgerdirect

      - name: Run integration suite
        run: |
          docker compose -f dev/ci/docker-compose.yml exec -T -w /var/www/html/modules/ledgerdirect prestashop \
            php dev/vendor/bin/phpunit -c dev/phpunit.xml.dist --testsuite integration --do-not-cache-result

      - name: Show container logs
        if: failure()
        run: docker compose -f dev/ci/docker-compose.yml logs --no-color

      - name: Stop PrestaShop Flashlight
        if: always()
        run: docker compose -f dev/ci/docker-compose.yml down -v

  # The distributable module: what a merchant uploads in the Back Office and
  # what the marketplace validator receives. `git archive` applies the
  # export-ignore rules in .gitattributes, so tests and tooling stay out;
  # runtime dependencies are bundled because PrestaShop does not run Composer
  # for a module. Every directory gets an index.php, as the validator requires.
  build:
    name: Release archive
    needs: changes
    # Fail-safe: a failed `changes` job leaves the output empty and the job runs; a skipped
    # job would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MIN }}
          coverage: none

      - name: Export the module sources
        run: |
          mkdir -p build
          git archive --format=tar --prefix=ledgerdirect/ HEAD | tar -x -C build

      - name: Bundle runtime dependencies
        working-directory: build/ledgerdirect
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Guard every directory with an index.php
        working-directory: build/ledgerdirect
        run: |
          find . -type d -not -exec test -e '{}/index.php' \; -print | while read -r dir; do
            cp index.php "$dir/index.php"
          done

      - name: Check the archive for development leftovers
        working-directory: build/ledgerdirect
        run: |
          for forbidden in dev tests .gitattributes .gitignore .github payment_page.png; do
            if [ -e "$forbidden" ]; then
              echo "::error::$forbidden must not ship in the release archive"
              exit 1
            fi
          done
          test -f ledgerdirect.php && test -f logo.png && test -f LICENSE.md && test -d vendor/hardcastle/ledger-direct-core

      # config.xml is PrestaShop's cached copy of the module class's properties.
      # Shipping it lets the upgrade scripts run right after the zip is uploaded
      # (devdocs, "config.xml file"), as ps_wirepayment and ps_checkpayment do.
      # PrestaShop regenerates it whenever it is older than ledgerdirect.php, so
      # the committed copy must say the same version as the class, or every
      # dev shop rewrites it and the working tree is dirty again.
      - name: Check config.xml against the module class
        working-directory: build/ledgerdirect
        run: |
          test -f config.xml || { echo "::error::config.xml is missing from the release archive"; exit 1; }
          class_version=$(grep -o "this->version = '[^']*'" ledgerdirect.php | sed "s/.*'\(.*\)'/\1/")
          xml_version=$(grep -o '<version>.*</version>' config.xml | sed -e 's/.*CDATA\[//' -e 's/\]\].*//')
          echo "ledgerdirect.php: $class_version, config.xml: $xml_version"
          if [ -z "$class_version" ] || [ "$class_version" != "$xml_version" ]; then
            echo "::error::config.xml says version '$xml_version' but ledgerdirect.php says '$class_version' — load the module once in a shop so PrestaShop regenerates it, then commit it with the version bump"
            exit 1
          fi

      - name: Create the zip
        working-directory: build
        run: zip -qr ledgerdirect.zip ledgerdirect

      - uses: actions/upload-artifact@v7
        with:
          name: ledgerdirect
          path: build/ledgerdirect.zip
          if-no-files-found: error

  # Weekly and on demand: the ruleset GitHub enforces on main is the one in .github/rulesets/main.json.
  # Not part of "CI passed": a pull request that changes the file differs from GitHub until the
  # ruleset is applied after the merge.
  ruleset:
    name: Branch rules match .github/rulesets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the ruleset on GitHub with the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/rulesets/check.sh "${{ github.repository }}" .github/rulesets/main.json

  # The one check a merge into main requires. Its name is in .github/rulesets/main.json: renaming the
  # job blocks every merge until the ruleset on GitHub is changed too. A job's own name changes with
  # its matrix and shows unexpanded when the job is skipped, so the branch rules name this job
  # instead. Skipped on purpose (a documentation-only pull request) counts as passed; failed or
  # cancelled does not. always(), not !cancelled(): a skipped job counts as passed, so this job has
  # to run and report in every case.
  passed:
    name: CI passed
    needs: [changes, lint, coding-standard, unit, phpstan, integration, build]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          # Jobs this check leaves out, by the start of their name: the weekly ruleset check, not in needs
          UNGATED: '["Branch rules match"]'
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well, except the ones in UNGATED:
        # whether they are finished at this point is a matter of timing.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq --argjson ungated "$UNGATED" '[.jobs[] | select(.status == "completed")
            | select(.name as $n | $ungated | any(. as $p | $n | startswith($p)) | not)]' jobs.json > gated.json
          jq -r '.[] | "\(.name): \(.conclusion)"' gated.json
          jq -e 'all(.[]; .conclusion == "success" or .conclusion == "skipped")' gated.json > /dev/null

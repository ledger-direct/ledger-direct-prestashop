# Keeps the module's runtime dependencies (vendor/), the development tooling
# (dev/vendor/), the actions in the workflows and the base images of the try
# image current. The two Composer projects are separate on purpose; see
# dev/composer.json.
#
# New releases wait a week before Dependabot proposes them (cooldown), so a release that is pulled
# again within days never reaches a pull request; security updates are not delayed. Updates within a
# major come as one pull request a week, a new major on its own.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Other modules (ps_checkout, psshipping) bundle their own Guzzle 7, and
      # whichever module autoloader registers last wins the namespace for the
      # whole request. A different major here would put them on our copy.
      - dependency-name: guzzlehttp/guzzle
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      composer-dev:
        patterns: ['*']
        update-types: [minor, patch]

  # The actions in the workflows, pinned to commit SHAs with the version in a comment. Dependabot
  # updates both; all action updates of a week come as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The base images of the try image, pinned by tag and digest in the FROM lines.
  - package-ecosystem: docker
    directory: /dev/try
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Flashlight's tags carry the PrestaShop version, the PHP version and the web server
      # (9.1.5-8.3-nginx); Dependabot misreads them and proposes floating tags or older PHP.
      # Flashlight is updated by hand together with the PrestaShop version.
      - dependency-name: prestashop/prestashop-flashlight

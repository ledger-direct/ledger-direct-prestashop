# Keeps the module's runtime dependencies (vendor/), the development tooling
# (dev/vendor/) and the actions in the workflows current. The two Composer
# projects are separate on purpose; see dev/composer.json.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Other modules (ps_checkout, psshipping) bundle their own Guzzle 7, and
      # whichever module autoloader registers last wins the namespace for the
      # whole request. A different major here would put them on our copy.
      - dependency-name: guzzlehttp/guzzle
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
